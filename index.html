      // Function to load icons dynamically
      function loadIcons() {
        const iconContainer = document.getElementById("iconContainer");
        iconContainer.innerHTML = "";
        for (const icon in icons) {
          const iconElement = document.createElement("div");
          iconElement.className = "flex flex-col items-center text-center p-2";
          iconElement.innerHTML = `
          <i class="${icons[icon]} text-3xl mb-2"></i>
          <p class="text-sm">${icons[icon]}</p>
        `;
          iconContainer.appendChild(iconElement);
        }
      }

      // Function to filter icons based on search input
      function filterIcons() {
        const searchValue = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const iconContainer = document.getElementById("iconContainer");
        iconContainer.innerHTML = "";
        for (const icon in icons) {
          if (icon.includes(searchValue)) {
            const iconElement = document.createElement("div");
            iconElement.className =
              "flex flex-col items-center text-center p-2";
            iconElement.innerHTML = `
            <i class="${icons[icon]} text-3xl mb-2"></i>
            <p class="text-sm">${icons[icon]}</p>
          `;
            iconContainer.appendChild(iconElement);
          }
        }
      }

      // Initial load of icons
      loadIcons();
    </script>
